# n8os.cfg — mapa de ld65 para el OS propio del N8 clon (GPL-3.0-or-later).
# Archivo de 32 KiB (múltiplo de 8 KiB): la BIOS lo deja en PRG-RAM 0x18000-0x1FFFF, que es $8000-$FFFF.
# $FC00-$FFF9 queda vacío: ahí copia la BIOS su página (docs/bios-n8-clon.md §3).
MEMORY {
    ZP:     start = $0000, size = $0100, type = rw;
    RAMCOD: start = $0200, size = $0100, type = rw;     # rutinas que corren en la RAM (lanzar.s)
    RAM:    start = $0300, size = $0500, type = rw;
    ROM:    start = $8000, size = $5400, type = ro, file = %O, fill = yes, fillval = $00;
    # Zona de trabajo dentro de la imagen (orden.s: el índice del orden alfabético). Se rehace en cada carpeta.
    # En el archivo, en su lugar va el código del FDS (fds_ovl.s): al encender, antes de usar la zona, el OS lo
    # copia al banco 8 de la PRG-RAM ($7000, con pila) y desde ahí corre.
    TRAB:   start = $D400, size = $1000, type = rw, file = "";
    OVLF:   start = $D400, size = $1000, type = ro, file = %O, fill = yes, fillval = $00;
    OVL:    start = $7000, size = $1000, type = rw;             # el código del FDS, en el banco 8
    OVLRAM: start = $6800, size = $0800, type = rw;             # sus variables, en el banco 8
    # RAM grande dentro de la imagen (el OS corre en PRG-RAM): ceros al encender, sobrevive a los resets y a la
    # vuelta de un juego, como ESTADO. Caché de páginas, ruta de carpetas y texto de la lista.
    GRANDE: start = $E400, size = $1700, type = rw, file = %O, fill = yes, fillval = $00;
    EST:    start = $FB00, size = $0100, type = rw, file = %O, fill = yes, fillval = $00;
    BIOS:   start = $FC00, size = $03FA, type = ro, file = %O, fill = yes, fillval = $00;
    VEC:    start = $FFFA, size = $0006, type = ro, file = %O, fill = yes;
}
SEGMENTS {
    ZEROPAGE: load = ZP,  type = zp;
    BSS:      load = RAM, type = bss, optional = yes;
    ARRANQUE: load = ROM, type = ro;    # primero: la entrada tiene que estar en $8000
    CODE:     load = ROM, type = ro;
    RODATA:   load = ROM, type = ro;
    RAMCOD:   load = ROM, run = RAMCOD, type = rw, define = yes;
    ESTADO:   load = EST, type = rw;
    GRANDE:   load = GRANDE, type = bss, optional = yes;
    TRABAJO:  load = TRAB, type = bss, optional = yes;
    FDSOVL:   load = OVLF, run = OVL, type = rw, define = yes;
    FDSBSS:   load = OVLRAM, type = bss, optional = yes;
    VECTORS:  load = VEC, type = ro;
}
