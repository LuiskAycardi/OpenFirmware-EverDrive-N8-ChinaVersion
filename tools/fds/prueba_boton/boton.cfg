# boton.cfg — el programa del disco de prueba va en $6000; los vectores, en $DFF6 (archivo aparte del disco).
MEMORY {
    PRG: start = $6000, size = $1000, type = ro, file = "programa.bin";
    VEC: start = $DFF6, size = $000A, type = ro, file = "vectores.bin";
}
SEGMENTS {
    CODIGO:   load = PRG, type = ro;
    VECTORES: load = VEC, type = ro;
}
