# f0.cfg — ROM de la prueba F0 del FDS (GPL-3.0-or-later): iNES, 32 KiB de PRG y 8 KiB de CHR.
MEMORY {
    ZP:   start = $0000, size = $0100, type = rw;
    CAB:  start = $0000, size = $0010, type = ro, file = %O, fill = yes;
    PRG:  start = $8000, size = $7FFA, type = ro, file = %O, fill = yes, fillval = $FF;
    VEC:  start = $FFFA, size = $0006, type = ro, file = %O, fill = yes;
    CHR:  start = $0000, size = $2000, type = ro, file = %O, fill = yes;
}
SEGMENTS {
    ZEROPAGE: load = ZP,  type = zp;
    CABECERA: load = CAB, type = ro;
    CODE:     load = PRG, type = ro;
    RODATA:   load = PRG, type = ro;
    VECTORS:  load = VEC, type = ro;
    CHARS:    load = CHR, type = ro;
}
