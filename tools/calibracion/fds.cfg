# fds.cfg — el programa del disco de calibración va en $6000; los vectores, en $DFF6 (archivo aparte del disco).
MEMORY {
    PRG: start = $6000, size = $1000, type = ro, file = "%O.prg";
    VEC: start = $DFF6, size = $000A, type = ro, file = "%O.vec";
}
SEGMENTS {
    CODIGO:   load = PRG, type = ro;
    VECTORES: load = VEC, type = ro;
}
