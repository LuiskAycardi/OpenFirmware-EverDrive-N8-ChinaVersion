# cart.cfg — ROM de calibración: 32 KiB de PRG (el código en los últimos 8 KiB, fijos en todos los mappers) y 8 KiB de CHR.
MEMORY {
    HDR:  start = $0000, size = $0010, type = ro, file = %O, fill = yes;
    PAD:  start = $8000, size = $6000, type = ro, file = %O, fill = yes, fillval = $FF;
    PRG:  start = $E000, size = $1FFA, type = ro, file = %O, fill = yes, fillval = $FF;
    VEC:  start = $FFFA, size = $0006, type = ro, file = %O, fill = yes;
    CHR:  start = $0000, size = $2000, type = ro, file = %O, fill = yes, fillval = $00;
}
SEGMENTS {
    HDR:      load = HDR, type = ro;
    CODIGO:   load = PRG, type = ro;
    VECTORES: load = VEC, type = ro;
}
